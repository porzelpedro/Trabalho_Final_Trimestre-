<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore cafés especiais do Empório do Café por nome, perfil de torra e preço.">
  <title>Nossos cafés | Empório do Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="main-header">
    <a class="logo-link" href="index.html" aria-label="Empório do Café — página inicial">
      <img class="logo-img" src="img/logo.png" alt="" onerror="this.style.display='none'">
      <span>Empório do Café</span>
    </a>
    <nav class="desktop-nav" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="cafes.html" aria-current="page">Nossos cafés</a>
      <a href="index.html#planos">Assinaturas</a>
      <a class="cart-link" href="carrinho.html"><span aria-hidden="true">🛍</span> Sacola <span class="cart-count" id="cart-count">0</span></a>
    </nav>
  </header>

  <main>
    <section class="catalog-hero">
      <p class="eyebrow">CONHEÇA NOSSA SELEÇÃO</p>
      <h1>Cafés especiais</h1>
      <p>Encontre seu próximo favorito entre diferentes origens e perfis de torra.</p>
    </section>

    <section class="controls-section catalog-controls" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Todos os cafés</h2>

      <div class="controls-wrapper">
        <label class="visually-hidden" for="search-input">Pesquisar cafés</label>
        <input class="search-bar" id="search-input" type="search" placeholder="Buscar por café ou sabor..." autocomplete="off">

        <label class="visually-hidden" for="sort-dropdown">Ordenar cafés</label>
        <select class="sort-dropdown" id="sort-dropdown">
          <option value="default">Ordenar: recomendados</option>
          <option value="asc">Preço: menor para maior</option>
          <option value="desc">Preço: maior para menor</option>
        </select>
      </div>

      <div class="filters" aria-label="Filtrar por torra">
        <button class="filter-btn active" type="button" onclick="setCategory('Todas', this)" aria-pressed="true">TODAS</button>
        <button class="filter-btn" type="button" onclick="setCategory('Clara', this)" aria-pressed="false">CLARA</button>
        <button class="filter-btn" type="button" onclick="setCategory('Média', this)" aria-pressed="false">MÉDIA</button>
        <button class="filter-btn" type="button" onclick="setCategory('Média-Clara', this)" aria-pressed="false">MÉDIA-CLARA</button>
        <button class="filter-btn" type="button" onclick="setCategory('Média-Escura', this)" aria-pressed="false">MÉDIA-ESCURA</button>
        <button class="filter-btn" type="button" onclick="setCategory('Escura', this)" aria-pressed="false">ESCURA</button>
      </div>

      <p class="results-count" id="results-count" aria-live="polite"></p>
    </section>

    <section class="product-grid catalog-grid" id="product-list" aria-label="Lista de cafés"></section>
  </main>

  <div class="modal-overlay" id="product-modal" role="dialog" aria-modal="true" aria-label="Detalhes do café">
    <div class="modal-content">
      <button class="close-btn" type="button" onclick="closeModal()" aria-label="Fechar detalhes">&times;</button>
      <div id="modal-details"></div>
    </div>
  </div>

  <footer class="site-footer">
    <a class="footer-brand" href="index.html">Empório do Café</a>
    <p>Uma pausa com mais sabor.</p>
    <small>Projeto acadêmico demonstrativo • 2026</small>
  </footer>
</body>
</html>
